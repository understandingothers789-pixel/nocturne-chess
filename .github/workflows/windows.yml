name: Windows desktop validation and build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      NOCTURNE_TEST_SYZYGY: ${{ github.workspace }}/.tb-test-fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Fetch checksum-verified development table fixtures
        run: python scripts/fetch_tablebase_test_data.py
      - name: Lint
        run: ruff check src tests scripts
      - name: Full tests including Qt and independent oracle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Windows apps and run packaged smoke checks
        run: python scripts/build_windows.py --build-only
      - name: Upload unsigned Windows test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-0.4.0-Windows-x64-unsigned
          path: |
            dist/Nocturne/
            dist/Nocturne-UCI/
          if-no-files-found: error
          retention-days: 30
