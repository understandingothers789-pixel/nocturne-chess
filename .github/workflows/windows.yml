name: Windows desktop validation and build
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/databases.yml'
      - 'scripts/check_explorer_api.py'
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read application version
        id: version
        shell: python
        run: |
          import os
          import tomllib
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Full tests including Qt and independent oracle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Windows apps and run packaged smoke checks
        run: python scripts/build_windows.py --build-only --skip-tests
      - name: Upload unsigned Windows test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-${{ steps.version.outputs.version }}-Windows-x64-unsigned
          path: |
            dist/Nocturne/
            dist/Nocturne-${{ steps.version.outputs.version }}-source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Live Masters, Lichess player and ChessDB API check
        continue-on-error: true
        run: python scripts/check_explorer_api.py
