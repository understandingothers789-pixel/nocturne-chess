name: Publish 187 download
on:
  push:
    branches: [publish/187-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 900 gh run watch 44694909502 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.187-Windows-x64-unsigned
          run-id: 44694909502
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.187-Windows-x64-unsigned.zip .
          gh release create v0.5.7.187 ../NocturneChess-0.5.7.187-Windows-x64-unsigned.zip --target e105824fcb0a4d8eb5ac1d7b846a22cedd2fce68 --title "Nocturne Chess 0.5.7.187" --notes "Windows x64 build with compact tactic rows, expandable continuations and filtered discoveries."
