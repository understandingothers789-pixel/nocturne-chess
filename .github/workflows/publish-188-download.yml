name: Publish 188 download
on:
  push:
    branches: [publish/188-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 1200 gh run watch 44797146089 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.188-Windows-x64-unsigned
          run-id: 44797146089
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.188-Windows-x64-unsigned.zip .
          gh release create v0.5.7.188 ../NocturneChess-0.5.7.188-Windows-x64-unsigned.zip --target 10f46958d666aeee1d92a003a440227a0bfb1ece --title "Nocturne Chess 0.5.7.188" --notes "Compact tactic continuations with tight spacing and contiguous move previews."
