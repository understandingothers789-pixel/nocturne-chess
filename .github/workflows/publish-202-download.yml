name: Publish 202 download
on:
  push:
    branches: [publish/202-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the first verified Windows build
        id: verified
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while true; do
            for run in 45866951412; do
              conclusion=$(gh run view "$run" --json conclusion --jq .conclusion) || continue
              if [[ "$conclusion" == success ]]; then
                echo "run_id=$run" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.202-Windows-x64-unsigned
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.202-Windows-x64-unsigned.zip .
          gh release create v0.5.7.202 ../NocturneChess-0.5.7.202-Windows-x64-unsigned.zip --target d2f9c5576b5f7002c405f1db424129a8591704d6 --title "Nocturne Chess 0.5.7.202" --notes "Reduces board repaint and analysis update work and fixes engine reuse across equivalent paths and changed launch arguments."
