name: Publish 195 download
on:
  push:
    branches: [publish/195-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 1200 gh run watch 45148302550 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.195-Windows-x64-unsigned
          run-id: 45148302550
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.195-Windows-x64-unsigned.zip .
          gh release create v0.5.7.195 ../NocturneChess-0.5.7.195-Windows-x64-unsigned.zip --target 05f72cc53df4590a431a853d976032e7ecf38004 --title "Nocturne Chess 0.5.7.195" --notes "Automatic Lichess endgame tablebase in the database explorer."
