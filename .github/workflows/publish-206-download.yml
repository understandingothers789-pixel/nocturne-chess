name: Publish 206 download
on:
  push:
    branches: [publish/206-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the first verified Windows build
        id: verified
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while true; do
            for run in 46079290015; do
              conclusion=$(gh run view "$run" --json conclusion --jq .conclusion) || continue
              if [[ "$conclusion" == success ]]; then
                echo "run_id=$run" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.206-Windows-x64-unsigned
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.206-Windows-x64-unsigned.zip .
          gh release create v0.5.7.206 ../NocturneChess-0.5.7.206-Windows-x64-unsigned.zip --target 3feb7cf31a1685c4ec4a9facd71a2d03d704c7ce --title "Nocturne Chess 0.5.7.206" --notes "Keeps five explorer moves visible and adds Games filters and browser analysis links."
