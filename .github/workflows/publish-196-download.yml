name: Publish 196 download
on:
  push:
    branches: [publish/196-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 1200 gh run watch 45588226710 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.196-Windows-x64-unsigned
          run-id: 45588226710
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.196-Windows-x64-unsigned.zip .
          gh release create v0.5.7.196 ../NocturneChess-0.5.7.196-Windows-x64-unsigned.zip --target 10390e897dce14b032065329f5428ae9d704b209 --title "Nocturne Chess 0.5.7.196" --notes "Continuous F11 self-play and immediate MultiPV keyboard changes."
