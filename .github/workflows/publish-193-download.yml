name: Publish 193 download
on:
  push:
    branches: [publish/193-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 1200 gh run watch 44854667215 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.193-Windows-x64-unsigned
          run-id: 44854667215
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.193-Windows-x64-unsigned.zip .
          gh release create v0.5.7.193 ../NocturneChess-0.5.7.193-Windows-x64-unsigned.zip --target 04d69b3b6dce69f670ada3219a56c16bc6b7b508 --title "Nocturne Chess 0.5.7.193" --notes "MultiPV keyboard shortcuts and improved Leela startup."
