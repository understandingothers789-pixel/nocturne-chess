name: Publish 194 download
on:
  push:
    branches: [publish/194-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 1200 gh run watch 45009845099 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.194-Windows-x64-unsigned
          run-id: 45009845099
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.194-Windows-x64-unsigned.zip .
          gh release create v0.5.7.194 ../NocturneChess-0.5.7.194-Windows-x64-unsigned.zip --target 032cfe3164af22d0ae29559562ebd6a61220d1b4 --title "Nocturne Chess 0.5.7.194" --notes "Engine search handoff fixes, faster checkpoint capture and Maia prefetch, and Leela resume fixes."
