name: Publish 204 download
on:
  push:
    branches: [publish/204-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the first verified Windows build
        id: verified
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while true; do
            for run in 45969053798; do
              conclusion=$(gh run view "$run" --json conclusion --jq .conclusion) || continue
              if [[ "$conclusion" == success ]]; then
                echo "run_id=$run" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.204-Windows-x64-unsigned
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.204-Windows-x64-unsigned.zip .
          gh release create v0.5.7.204 ../NocturneChess-0.5.7.204-Windows-x64-unsigned.zip --target a2f1312fc6535ef996bf04c3f1d11622b6ce5e24 --title "Nocturne Chess 0.5.7.204" --notes "Restores reference Nibbler colors and expected-score markers, with a separate historical Nocturne MultiPV preset."
