name: Publish 205 download
on:
  push:
    branches: [publish/205-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the first verified Windows build
        id: verified
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while true; do
            for run in 46066467970; do
              conclusion=$(gh run view "$run" --json conclusion --jq .conclusion) || continue
              if [[ "$conclusion" == success ]]; then
                echo "run_id=$run" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.205-Windows-x64-unsigned
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.205-Windows-x64-unsigned.zip .
          gh release create v0.5.7.205 ../NocturneChess-0.5.7.205-Windows-x64-unsigned.zip --target f6cf6f74705f5f34ede73da310acf74b5d0b403f --title "Nocturne Chess 0.5.7.205" --notes "Adds Lichess date and rating filters, sample-game import, board arrow tooltip and palette updates, and a Lichess-style evaluation bar."
