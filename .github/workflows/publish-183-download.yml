name: Publish 183 download
on:
  push:
    branches: [publish/183-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 900 gh run watch 44677293853 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.183-Windows-x64-unsigned
          run-id: 44677293853
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.183-Windows-x64-unsigned.zip .
          gh release create v0.5.7.183 ../NocturneChess-0.5.7.183-Windows-x64-unsigned.zip --target 3530736ca578776de8c9d43dac77ccf491de8e7a --title "Nocturne Chess 0.5.7.183" --notes "Windows x64 build with updated node-limit shortcuts."
