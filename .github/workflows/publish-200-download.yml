name: Publish 200 download
on:
  push:
    branches: [publish/200-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the first verified Windows build
        id: verified
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while true; do
            for run in 45722889488; do
              conclusion=$(gh run view "$run" --json conclusion --jq .conclusion) || continue
              if [[ "$conclusion" == success ]]; then
                echo "run_id=$run" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.200-Windows-x64-unsigned
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.200-Windows-x64-unsigned.zip .
          gh release create v0.5.7.200 ../NocturneChess-0.5.7.200-Windows-x64-unsigned.zip --target 2bbc1cdbc44edf5bd4d400dcfc93105965810e24 --title "Nocturne Chess 0.5.7.200" --notes "Adds Stockfish-only Lichess and Nibbler arrow presets, plus the three pairwise engine and model layouts."
