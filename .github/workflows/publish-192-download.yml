name: Publish 192 download
on:
  push:
    branches: [publish/192-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 1200 gh run watch 44839100679 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.192-Windows-x64-unsigned
          run-id: 44839100679
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.192-Windows-x64-unsigned.zip .
          gh release create v0.5.7.192 ../NocturneChess-0.5.7.192-Windows-x64-unsigned.zip --target 6a9209434ec537ee1f3bd043c2fc860ba6ff3fd7 --title "Nocturne Chess 0.5.7.192" --notes "Honor explicit engine thread selections during checkpoint capture."
