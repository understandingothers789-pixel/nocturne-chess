name: Publish 182 download
on:
  push:
    branches: [publish/182-download]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 900 gh run watch 44602312595 --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: NocturneChess-0.5.7.182-Windows-x64-unsigned
          run-id: 44602312595
          github-token: ${{ github.token }}
          path: download
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd download
          zip -qr ../NocturneChess-0.5.7.182-Windows-x64-unsigned.zip .
          gh release create v0.5.7.182 ../NocturneChess-0.5.7.182-Windows-x64-unsigned.zip --target 47d1268b9ff70b462b190f38245856258a8d3b8b --title "Nocturne Chess 0.5.7.182" --notes "Windows x64 build with the Maia DirectML inference fix."
