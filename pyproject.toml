[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-chess"
version = "0.4.0"
description = "An offline native chess studio with an independent, inspectable chess engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "Nocturne Chess contributors"}]
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "python-chess==1.999", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
nocturne = "nocturne.__main__:main"
nocturne-uci = "nocturne.engine.uci:main"
nocturne-bench = "nocturne.engine.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nocturne = ["assets/*.svg", "assets/*.ico", "assets/pieces/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: deeper perft and extended validation"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
