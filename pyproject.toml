[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-chess"
version = "0.5.7.107"
description = "A native offline Stockfish and Maia chess analysis studio"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["COPYING", "LICENSE", "licenses/*.txt"]
authors = [{name = "Nocturne Chess contributors"}]
dependencies = ["PySide6>=6.8,<7", "chess==1.11.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "python-chess==1.999", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
nocturne = "nocturne.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nocturne = ["assets/fonts/*.ttf", "assets/fonts/*.sfd", "assets/*.svg", "assets/*.ico", "assets/pieces/*.svg", "assets/pieces/original/*.svg", "assets/pieces/nibbler/*.png", "assets/pieces/nibbler/source/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: deeper perft and extended validation"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/nocturne/maia/vendor/*.py" = ["E4", "E7", "E9", "F"]
